<!doctype html>
<!-- PROTOTYPE — throwaway. Branch prototype/command-palette only; never merge. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Command Palette prototype</title>
    <style>
      :root {
        --page: #ffffff;
        --toolbar: #e9e9eb;
        --tab-on: #f7f7f8;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --line: rgba(0, 0, 0, 0.1);
        --skel: #eeeef0;
        --panel: rgba(246, 246, 248, 0.8);
        --panel-border: rgba(0, 0, 0, 0.14);
        --accent: #0a63e0;
        --row-sel: rgba(0, 0, 0, 0.06);
        --tile: rgba(0, 0, 0, 0.05);
        --foot: rgba(0, 0, 0, 0.025);
        --kbd: rgba(255, 255, 255, 0.7);
        --start: linear-gradient(160deg, #dfe4ee, #eef0f4 40%, #e6e2ec);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #1e1e20;
          --toolbar: #2a2a2d;
          --tab-on: #3a3a3e;
          --text: #f5f5f7;
          --muted: #9a9aa0;
          --line: rgba(255, 255, 255, 0.1);
          --skel: #2b2b2f;
          --panel: rgba(38, 38, 42, 0.74);
          --panel-border: rgba(255, 255, 255, 0.14);
          --accent: #0a5fd6;
          --row-sel: rgba(255, 255, 255, 0.08);
          --tile: rgba(255, 255, 255, 0.07);
          --foot: rgba(255, 255, 255, 0.03);
          --kbd: rgba(255, 255, 255, 0.08);
          --start: linear-gradient(160deg, #23252c, #1d1e22 45%, #26222b);
        }
      }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        color: var(--text);
        background: var(--page);
        -webkit-font-smoothing: antialiased;
      }
      kbd {
        font: 500 11px -apple-system, system-ui, sans-serif;
        padding: 1px 5px;
        border-radius: 4px;
        border: 0.5px solid var(--line);
        background: var(--kbd);
      }

      /* ---------- the fake Safari Window (Compact Toolbar) ---------- */
      #toolbar {
        position: fixed; top: 0; left: 0; right: 0; height: 38px;
        display: flex; align-items: center; gap: 10px; padding: 0 10px;
        background: var(--toolbar); border-bottom: 0.5px solid var(--line);
      }
      .lights { display: flex; gap: 8px; padding-right: 6px; }
      .lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
      .lights i:nth-child(2) { background: #febc2e; }
      .lights i:nth-child(3) { background: #28c840; }
      #profile-btn { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 6px; border-radius: 6px; flex: none; }
      #profile-btn i { width: 13px; height: 13px; border-radius: 50%; }
      #tabs { display: flex; flex: 1; gap: 3px; min-width: 0; }
      .tab { flex: 1 1 0; min-width: 0; max-width: 230px; height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 9px; border-radius: 6px; font-size: 12px; color: var(--muted); }
      .tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tab.on { background: var(--tab-on); color: var(--text); box-shadow: 0 0 0 0.5px var(--line), 0 1px 2px rgba(0,0,0,.06); }
      .ext { display: flex; gap: 8px; flex: none; }
      .ext i { width: 16px; height: 16px; border-radius: 4px; background: var(--skel); }
      #page { position: fixed; top: 38.5px; left: 0; right: 0; bottom: 0; overflow: hidden; }
      #page.start { background: var(--start); }
      .fake { max-width: 760px; margin: 52px auto 0; padding: 0 28px; }
      .fake-url { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
      .fake h1 { font: 700 30px/1.2 -apple-system, system-ui; margin: 0 0 22px; letter-spacing: -0.02em; }
      .bar { height: 10px; border-radius: 5px; background: var(--skel); margin: 13px 0; }
      .block { height: 170px; border-radius: 12px; background: var(--skel); margin: 28px 0; }
      .hint { margin: -28px 0 24px; color: var(--muted); font-size: 12px; line-height: 2; }
      .sp { max-width: 620px; margin: 70px auto 0; padding: 0 24px; }
      .sp h2 { font: 700 15px -apple-system; margin: 0 0 14px; }
      .sp-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 16px; margin-bottom: 36px; }
      .sp-fav { aspect-ratio: 1; border-radius: 12px; background: var(--tile); }
      .sp-card { height: 70px; border-radius: 12px; background: var(--tile); }

      /* ---------- shared bits ---------- */
      #scrim { position: fixed; inset: 0; z-index: 9; }
      #palette { position: fixed; top: 17vh; left: 50%; transform: translateX(-50%); z-index: 10; }
      .fav { border-radius: 4px; flex: none; object-fit: contain; }
      .mono { display: inline-grid; place-items: center; border-radius: 22%; color: #fff; font-weight: 600; flex: none; line-height: 1; }
      .glyph { display: inline-grid; place-items: center; color: var(--muted); width: 24px; height: 24px; flex: none; }
      .glyph.sm { width: 18px; height: 18px; }
      .material {
        background: var(--panel);
        -webkit-backdrop-filter: blur(40px) saturate(190%);
        backdrop-filter: blur(40px) saturate(190%);
        border: 0.5px solid var(--panel-border);
      }

      /* ---------- A · Spotlight ---------- */
      .pa {
        width: min(680px, calc(100vw - 32px)); border-radius: 18px; overflow: hidden;
        background: var(--panel); -webkit-backdrop-filter: blur(40px) saturate(190%); backdrop-filter: blur(40px) saturate(190%);
        border: 0.5px solid var(--panel-border);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.3), 0 0 0 0.5px rgba(0, 0, 0, 0.1);
      }
      .pa-field { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 18px; }
      .pa-lead { width: 26px; height: 26px; display: grid; place-items: center; flex: none; }
      .pa-input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: 400 24px -apple-system, system-ui; letter-spacing: -0.01em; padding: 0; }
      .pa-input::placeholder { color: var(--muted); }
      .pa-prof { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted); flex: none; }
      .pa-prof i { width: 9px; height: 9px; border-radius: 50%; }
      .pa-list { border-top: 0.5px solid var(--line); padding: 6px; }
      .pa-row { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; font-size: 14px; white-space: nowrap; cursor: default; }
      .pa-t { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; max-width: 62%; }
      .pa-u { color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
      .pa-act { margin-left: auto; padding-left: 8px; font-size: 12px; flex: none; display: none; }
      .pa-row.sel { background: var(--accent); color: #fff; }
      .pa-row.sel .pa-u { color: rgba(255, 255, 255, 0.72); }
      .pa-row.sel .pa-act { display: block; color: rgba(255, 255, 255, 0.88); }
      .pa-row.sel .glyph { color: #fff; }

      /* ---------- B · Sectioned ---------- */
      .pb {
        width: min(600px, calc(100vw - 32px)); border-radius: 12px; overflow: hidden;
        background: var(--panel); -webkit-backdrop-filter: blur(40px) saturate(190%); backdrop-filter: blur(40px) saturate(190%);
        border: 0.5px solid var(--panel-border);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.24), 0 0 0 0.5px rgba(0, 0, 0, 0.08);
      }
      .pb-field { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 0.5px solid var(--line); }
      .pb-chip { display: flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; flex: none; font: 600 12px -apple-system, system-ui; background: color-mix(in srgb, var(--c) 16%, transparent); color: color-mix(in srgb, var(--c) 75%, var(--text)); }
      .pb-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
      .pb-input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: 400 17px -apple-system, system-ui; padding: 0; }
      .pb-input::placeholder { color: var(--muted); }
      .pb-body { max-height: 460px; overflow: auto; padding: 2px 6px 6px; }
      .pb-sec { font: 600 11px -apple-system, system-ui; color: var(--muted); padding: 10px 10px 4px; letter-spacing: 0.01em; }
      .pb-row { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; cursor: default; }
      .pb-tile { width: 30px; height: 30px; border-radius: 8px; background: var(--tile); display: grid; place-items: center; flex: none; }
      .pb-tile.glyph { padding: 7px; box-sizing: border-box; }
      .pb-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
      .pb-t, .pb-u { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pb-t { font: 500 13.5px -apple-system, system-ui; }
      .pb-u { font-size: 12px; color: var(--muted); }
      .pb-act { font-size: 11.5px; color: var(--muted); visibility: hidden; flex: none; }
      .pb-row.sel { background: var(--row-sel); }
      .pb-row.sel::before { content: ""; position: absolute; left: 1px; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--c); }
      .pb-row.sel .pb-act { visibility: visible; }
      .pb-foot { display: flex; justify-content: space-between; gap: 12px; padding: 7px 14px; font-size: 11.5px; color: var(--muted); border-top: 0.5px solid var(--line); background: var(--foot); }
      .pb-keys kbd { margin-left: 8px; }
      .pb-keys kbd:first-child { margin-left: 0; }

      /* ---------- C · Address ---------- */
      .pc {
        width: min(640px, calc(100vw - 32px)); border-radius: 14px; overflow: hidden;
        background: var(--panel); -webkit-backdrop-filter: blur(40px) saturate(190%); backdrop-filter: blur(40px) saturate(190%);
        border: 0.5px solid var(--panel-border); border-top: 3px solid var(--c);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent), 0 22px 60px rgba(0, 0, 0, 0.28), 0 0 46px color-mix(in srgb, var(--c) 20%, transparent);
      }
      .pc-cap { display: flex; gap: 8px; align-items: baseline; padding: 10px 16px 0; font: 600 10.5px -apple-system, system-ui; text-transform: uppercase; letter-spacing: 0.08em; }
      .pc-cap b { color: var(--c); }
      .pc-cap span { color: var(--muted); font-weight: 500; }
      .pc-field { position: relative; height: 46px; margin: 0 16px; }
      .pc-ghost, .pc-input { position: absolute; inset: 0; margin: 0; padding: 0; font: 400 19px/46px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0; }
      .pc-ghost { white-space: pre; pointer-events: none; overflow: hidden; }
      .pc-gt { color: transparent; }
      .pc-gs { color: color-mix(in srgb, var(--c) 50%, var(--muted)); }
      .pc-gk { font: 600 10px -apple-system, system-ui; vertical-align: 3px; margin-left: 8px; padding: 1px 5px; border-radius: 4px; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); background: none; }
      .pc-input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); caret-color: var(--c); }
      .pc-input::placeholder { color: var(--muted); font-family: -apple-system, system-ui; font-size: 17px; }
      .pc-list { padding: 4px 8px 8px; border-top: 0.5px solid var(--line); }
      .pc-row { display: grid; grid-template-columns: 16px minmax(0, 1.4fr) minmax(0, 1fr) auto; align-items: center; gap: 10px; height: 30px; padding: 0 8px; border-radius: 6px; cursor: default; }
      .pc-g { width: 15px; height: 15px; color: var(--c); opacity: 0.85; }
      .pc-url { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
      .pc-url b { color: var(--text); font-weight: 600; }
      .pc-title { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
      .pc-act { display: none; font-size: 11px; font-weight: 600; color: var(--c); }
      .pc-row.sel { background: color-mix(in srgb, var(--c) 17%, transparent); }
      .pc-row.sel .pc-act { display: block; }
      .pc-list.tiles { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; padding: 12px 10px; }
      .pc-tile { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 2px 8px; border-radius: 10px; font-size: 11px; color: var(--muted); cursor: default; }
      .pc-tile span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pc-tile.sel { background: color-mix(in srgb, var(--c) 17%, transparent); color: var(--text); }

      /* ---------- prototype-only furniture (not part of the design) ---------- */
      #toast {
        position: fixed; top: 50px; left: 50%; transform: translateX(-50%); z-index: 30; max-width: min(720px, 80vw);
        padding: 8px 14px; border-radius: 10px; background: rgba(20, 20, 22, 0.9); color: #f2f2f2; font: 12px/1.4 ui-monospace, Menlo, monospace;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      #bar {
        position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 40;
        display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 3px; max-width: calc(100vw - 32px);
        padding: 6px 8px; border-radius: 22px; background: #111; color: #ddd; border: 1.5px solid #ffd84d;
        font: 11.5px ui-monospace, Menlo, monospace; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      }
      #bar button { all: unset; cursor: pointer; padding: 4px 9px; border-radius: 999px; color: #bbb; white-space: nowrap; }
      #bar button:hover { background: #2a2a2a; color: #fff; }
      #bar button.on { background: #ffd84d; color: #111; }
      #bar button[disabled] { opacity: 0.35; cursor: default; }
      #bar .bar-label { padding: 0 6px; color: #fff; min-width: 120px; text-align: center; }
      #bar .bar-label b { color: #ffd84d; }
      #bar .sep { width: 1px; height: 16px; background: #3a3a3a; margin: 0 4px; }
      #why {
        position: fixed; top: 50px; right: 12px; z-index: 35; width: 340px; max-height: calc(100vh - 130px); overflow: auto; box-sizing: border-box;
        padding: 12px 14px; border-radius: 12px; background: rgba(14, 14, 16, 0.92); color: #d8d8d8; border: 1.5px solid #ffd84d;
        font: 11.5px/1.5 ui-monospace, Menlo, monospace;
      }
      #why h3 { margin: 0 0 8px; font-size: 12px; color: #ffd84d; }
      #why h3 small { color: #888; font-weight: 400; margin-left: 6px; }
      #why h4 { margin: 12px 0 4px; font-size: 11px; color: #ffd84d; font-weight: 600; }
      #why dl { display: grid; grid-template-columns: 88px 1fr; gap: 2px 8px; margin: 0; }
      #why dt { color: #888; }
      #why dd { margin: 0; word-break: break-word; }
      #why code { color: #fff; }
      #why code u { text-decoration: none; background: #3a4d80; }
      #why table { width: 100%; border-collapse: collapse; }
      #why td { padding: 1px 4px 1px 0; vertical-align: top; }
      #why td.clip { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #why tr.no { color: #777; }
      #why tr.won { color: #ffd84d; }
      #why p { margin: 0; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <div class="lights"><i></i><i></i><i></i></div>
      <div id="profile-btn"></div>
      <div id="tabs"></div>
      <div class="ext"><i></i><i></i><i></i></div>
    </div>
    <div id="page"></div>
    <div id="scrim" hidden></div>
    <div id="palette" hidden></div>
    <div id="toast" hidden></div>
    <div id="why" hidden></div>
    <div id="bar"></div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
